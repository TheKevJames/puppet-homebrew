version: 2.1

orbs:
  pre-commit: https://raw.githubusercontent.com/TheKevJames/tools/refs/heads/master/circleci-orbs/pre-commit.yml

executors:
  ruby:
    docker:
      - image: ruby:3.4.10
    resource_class: medium
  python:
    docker:
      - image: python:3.14.7
    resource_class: medium

jobs:
  test:
    executor: ruby
    environment:
      STRICT_VARIABLES: "yes"
    parameters:
      version:
        type: string
    steps:
      - checkout
      - run: ./bin/build --puppet "<< parameters.version >>"
      - run: puppet module install pkg/thekevjames-homebrew-*.tar.gz
      # - run: ./test
      - store_artifacts:
          path: pkg/

workflows:
  run-jobs:
    jobs:
      - pre-commit/pre-commit:
          executor: python
      - test:
          # renovate: datasource=rubygems depName=puppet
          version: 8.10.0
