name: ci

on: [pull_request, push]

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.4
          # renovate: datasource=docker depName=python
          python-version: 3.15.0
      - uses: j178/prek-action@v3.1.0
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: v0.5.7
          extra-args: --all-files

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    env:
      STRICT_VARIABLES: 'yes'
      # renovate: datasource=rubygems depName=puppet
      puppet_version: 8.10.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.329.0
      - run: ./bin/build --puppet "${puppet_version}"
      - run: puppet module install pkg/thekevjames-homebrew-*.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pkg
          path: pkg/
