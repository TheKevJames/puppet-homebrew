name: ci

on: [pull_request, push]

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.5
          # renovate: datasource=docker depName=python
          python-version: 3.15.2
      - uses: j178/prek-action@v3.1.0
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: v0.5.7
          extra-args: --all-files

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    env:
      STRICT_VARIABLES: 'yes'
      # renovate: datasource=rubygems depName=puppet
      puppet_version: 8.10.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.335.0
      - run: ./bin/build --puppet "${puppet_version}"
      - run: puppet module install pkg/thekevjames-homebrew-*.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pkg
          path: pkg/

  # Merging a version change is the release: this pushes its tag, with the
  # `tag` environment's deploy key (see TheKevJames/tools _tag.yml), and the
  # tag push runs the jobs below.
  tag:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: TheKevJames/tools/.github/workflows/_tag.yml@master
    with:
      version-command: jq -r .version metadata.json
    secrets:
      TAG_DEPLOY_KEY: ${{ secrets.TAG_DEPLOY_KEY }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-26.04
    environment:
      name: forge
      url: https://forge.puppet.com/modules/thekevjames/homebrew
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # For the check that the tag is on master.
          fetch-depth: 0
          persist-credentials: false
      - name: validate the tag
        run: |
          version="$(jq -r .version metadata.json)"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match metadata.json version ${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit on master"
            exit 1
          fi
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pkg
          path: pkg/
      - env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${FORGE_API_KEY}" \
            --form "file=@pkg/thekevjames-homebrew-${GITHUB_REF_NAME}.tar.gz" \
            https://forgeapi.puppet.com/v3/releases

  github-release:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: TheKevJames/tools/.github/workflows/_github-release.yml@master
    with:
      artifact: pkg
